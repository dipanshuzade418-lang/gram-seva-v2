<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GRAM Arogya Seva</title>
    <!--
      GitHub Pages has no server-side routing, so any direct visit or refresh
      on a route like /register or /doctors/123 hits this 404 page instead of
      index.html. This script rewrites the URL into a query string and sends
      the visitor back to index.html, where the matching script in
      index.html restores the real URL so React Router can take over.
      This is the standard SPA-on-GitHub-Pages redirect trick
      (https://github.com/rafgraph/spa-github-pages).
    -->
    <script>
      var path = location.pathname + location.search + location.hash;
      location.replace('/?redirect=' + encodeURIComponent(path));
    </script>
  </head>
  <body></body>
</html>
